model:
  id: Qwen/Qwen2.5-VL-7B-Instruct
  device: cuda
  dtype: bfloat16
  max_new_tokens: 256

preprocess:
  target_fps: 2.0
  source_fps: 30.0
  max_seconds: 16.0
  padding: repeat_first
  max_pixels: 1368
  min_pixels: null

hardware:
  default_batch_size: 1
  gpu_batch_sizes:
    A4000: 1
    4090: 2
    5090: 2

eval:
  split: val
  split_path: task_2_evaluation_suite/val.json
  dataset_root: /workspace/datasets/mm-au/Origin/DADA2000/DADA2000
  xlsx_path: /workspace/datasets/mm-au/dada_text_annotations.xlsx
  output_path: artifacts/evals/dada_eval_val.json
  max_retries: 3
  limit_batches: null
  dump_every_batches: 10
