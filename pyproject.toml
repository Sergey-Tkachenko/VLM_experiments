[project]
name = "vlm-experiments"
version = "0.1.0"
description = "VLM experiments for dashcam analysis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "decord>=0.6.0",
    "einops>=0.7.0",
    "fiftyone>=1.0.0",
    "huggingface-hub>=0.24.6",
    "jinja2>=3.1.4",
    "jupyterlab>=4.5.1",
    "loguru>=0.7.2",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.2.1",
    "safetensors>=0.4.4",
    "torch>=2.4,<2.5",
    "tqdm>=4.66.0",
    "transformers @ git+https://github.com/huggingface/transformers",
    "pyyaml>=6.0.2",
    "py-spy>=0.4.1",
    "flash-attn>=2.8.3",
    "torchvision>=0.19.1",
    "accelerate>=0.33.0",
    "qwen-vl-utils[decord]>=0.0.8",
    "ipywidgets>=8.1.8",
    "anywidget>=0.9.21",
]

[dependency-groups]
dev = [
    "pyright>=1.1.384",
    "pytest>=8.3.2",
    "ruff>=0.6.2",
]

[tool.pytest.ini_options]
addopts = "-v -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require external dependencies or hardware",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
link-mode = "copy"

[tool.uv.extra-build-dependencies]
flash-attn = ["torch>=2.4,<2.5"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
